server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Komprese (index.html má cca 800 kB)
    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Správný typ pro manifest PWA (použije se jen tehdy, když ho nginx nezná;
    # blok "types" na úrovni serveru by přepsal všechny výchozí typy)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service worker se nesmí cachovat, jinak se nová verze nenačte
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Stránka se vždy ověřuje, aby byla aktuální
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
